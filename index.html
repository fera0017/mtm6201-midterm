<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Set the page character set -->
    <meta charset="UTF-8">

    <!-- Make the layout work on different screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Show the project name in the browser tab -->
    <title>Midterm Project</title>

    <!-- Load the fonts for the page -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Connect the page to the stylesheet -->
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <!-- Let keyboard users jump to the main content -->
    <a href="#main" class="skip-link">Skip to main content</a>

    <header>
        <div class="page head">
            <!-- Go back to the start of the site -->
            <a href="index.html">
                <img src="images/my-coffee-shop-logo.svg" alt="My Coffee House">
            </a>

            <!-- Move between the page sections -->
            <nav aria-label="Main navigation">
                <ul class="links">
                    <li><a href="#about">About Us</a></li>
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#locations">Locations</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main">
        <!-- Introduce the coffee house -->
        <section class="home" aria-labelledby="home-title">
            <div class="page">
                <div class="home-text">
                    <h1 id="home-title">Experience coffee like never before</h1>
                    <p>
                        We craft more than beverages; we curate memories,
                        one flavorful moment at a time. Embrace the aroma
                        and let every visit be a chapter in your coffee story.
                    </p>
                    <a class="btn-link" href="#menu">Explore our menu</a>
                </div>
            </div>
        </section>
    </main>

    <!-- The copyright information will go here -->
    <footer>
    </footer>
</body>
</html>
